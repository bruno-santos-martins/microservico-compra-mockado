services:
  redis:
    image: redis:alpine
    container_name: click_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - click_cannabis_net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: click_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    networks:
      - click_cannabis_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:latest
    container_name: click_localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - click_cannabis_net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: click_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4318:4318"
    networks:
      - click_cannabis_net

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: click_uptime_kuma
    restart: unless-stopped
    ports:
      - "3002:3001"
    environment:
      TZ: America/Sao_Paulo
    volumes:
      - uptime_kuma_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - click_cannabis_net

volumes:
  redis_data:
  rabbit_data:
  localstack_data:
  uptime_kuma_data:

networks:
  click_cannabis_net:
    name: click_cannabis_net
    driver: bridge