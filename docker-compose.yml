networks:
  click_cannabis_net:
    external: true
    name: click_cannabis_net

services:
  api-gateway-service:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    container_name: click_api_gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
      ORDER_SERVICE_URL: http://order-catalog-service:3000
      ORDER_SERVICE_WS_URL: http://order-catalog-service:3000
      INVENTORY_SERVICE_URL: http://inventory-service:3001
      PAYMENT_SERVICE_URL: http://payment-service:3333
      RATE_LIMIT_MAX_REQUESTS: 120
      RATE_LIMIT_WINDOW_MS: 60000
    depends_on:
      - order-catalog-service
      - inventory-service
      - payment-service
    volumes:
      - ./api-gateway-service:/app
      - /app/node_modules
    networks:
      - click_cannabis_net

  order-catalog-service:
    build:
      context: ./order-catalog-service
      dockerfile: Dockerfile
    container_name: click_order_catalog
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
      DB_HOST: click_postgres_orders
      DB_PORT: 5432
      DB_USER: root
      DB_PASS: password
      DB_NAME: order_catalog_db
      DATABASE_URL: postgresql://root:password@click_postgres_orders:5432/order_catalog_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      AWS_ENDPOINT: http://localstack:4566
      AWS_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET_PRESCRIPTIONS: click-prescriptions
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ./order-catalog-service:/app
      - /app/node_modules
    networks:
      - click_cannabis_net

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: click_inventory_worker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
      DB_HOST: click_postgres_inventory
      DB_PORT: 5432
      DB_USER: root
      DB_PASS: password
      DB_NAME: inventory_db
      DATABASE_URL: postgresql://root:password@click_postgres_inventory:5432/inventory_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ./inventory-service:/app
      - /app/node_modules
    networks:
      - click_cannabis_net

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: click_payment_worker
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      PORT: 3333
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
      APP_KEY: base64:a0B1c2D3e4F5g6H7i8J9k0L1m2N3o4P5q6R7s8T9u0V=
      DB_HOST: click_postgres_payment
      DB_PORT: 5432
      DB_USER: root
      DB_PASS: password
      DB_NAME: payment_db
      DATABASE_URL: postgresql://root:password@click_postgres_payment:5432/payment_db?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://admin:admin@rabbitmq:5672
      TRACKING_STAGE_INTERVAL_SECONDS: 60 # Ajustável facilmente para 10s nas demos
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    volumes:
      - ./payment-service:/app
      - /app/node_modules
    networks:
      - click_cannabis_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: click_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_WS_URL: http://localhost:8080
      VITE_USE_MOCK_API: "false"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
    depends_on:
      - api-gateway-service
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - click_cannabis_net